<!DOCTYPE html>
<html>
<head>
  <title>Image Candidates</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    img { width: 100%; height: 260px; object-fit: cover; }
    .info { padding: 12px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Candidate Hero Images for "Student with Mentor / Elder Brother"</h2>
  <div class="grid">
    <div class="card">
      <img src="/images/mentor-brother-1.jpg">
      <div class="info">Candidate 1 (mentor-brother-1.jpg)</div>
    </div>
    <div class="card">
      <img src="/images/mentor-brother-2.jpg">
      <div class="info">Candidate 2 (mentor-brother-2.jpg)</div>
    </div>
    <div class="card">
      <img src="/images/mentor-brother-3.jpg">
      <div class="info">Candidate 3 (mentor-brother-3.jpg)</div>
    </div>
    <div class="card">
      <img src="/images/mentor-brother-4.jpg">
      <div class="info">Candidate 4 (mentor-brother-4.jpg)</div>
    </div>
    <div class="card">
      <img src="/images/mentorship.jpg">
      <div class="info">Mentorship (mentorship.jpg)</div>
    </div>
    <div class="card">
      <img src="/images/student-notes.jpg">
      <div class="info">Student Notes (student-notes.jpg)</div>
    </div>
  </div>
</body>
</html>
